# PostgreSQL 16 local pour le développement :  docker compose up -d
# URL correspondante : postgresql+psycopg://ciat:ciat_local@127.0.0.1:5432/ciat_vision
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ciat
      POSTGRES_PASSWORD: ciat_local
      POSTGRES_DB: ciat_vision
    ports:
      - "5432:5432"
    volumes:
      - ciat_pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
volumes:
  ciat_pgdata:
